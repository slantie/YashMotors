services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot migration job. Runs to completion once per `up`, BEFORE the backend starts,
  # so schema changes are applied explicitly rather than on every app boot (HIGH-002).
  backend-migrate:
    build:
      context: .
      dockerfile: artifacts/backend/Dockerfile
    restart: "no"
    env_file: artifacts/backend/.env
    command: ["node", "./dist/db/migrate.js"]

  backend:
    build:
      context: .
      dockerfile: artifacts/backend/Dockerfile
    restart: unless-stopped
    env_file: artifacts/backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WHATSAPP_API_URL: http://api-server:8080
      WHATSAPP_INTERNAL_SECRET: ${WHATSAPP_INTERNAL_SECRET}
    depends_on:
      redis:
        condition: service_healthy
      backend-migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3001"

  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    env_file: artifacts/api-server/.env
    environment:
      PORT: "8080"
      INTERNAL_SECRET: ${WHATSAPP_INTERNAL_SECRET}
    volumes:
      - baileys_auth:/app/auth_info_baileys
    ports:
      - "127.0.0.1:8080:8080"

  ocr:
    build:
      context: services/ocr
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: services/ocr/.env
    volumes:
      - paddleocr_models:/root/.paddleocr
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Archive portal runs on Vercel in production, not in this stack. Gated behind a profile
  # so the default `docker compose up` does NOT build it (the prod box has no archive-ui dir).
  # Run locally with: docker compose --profile archive up
  archive:
    profiles: ["archive"]
    build:
      context: .
      dockerfile: artifacts/archive-ui/Dockerfile
    restart: unless-stopped
    env_file: artifacts/archive-ui/.env
    ports:
      - "127.0.0.1:3003:3000"

  # ── Observability: Prometheus scrapes /metrics from backend + api-server ──────
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - backend
      - api-server

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3010:3000"

volumes:
  redis_data:
  baileys_auth:
  paddleocr_models:
  prometheus_data:
  grafana_data:
