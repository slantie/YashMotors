services:

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: artifacts/backend/Dockerfile
    restart: unless-stopped
    env_file: artifacts/backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WHATSAPP_API_URL: http://api-server:8080
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "3001"

  api-server:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    restart: unless-stopped
    env_file: artifacts/api-server/.env
    environment:
      PORT: "8080"
    volumes:
      - baileys_auth:/app/auth_info_baileys
    expose:
      - "8080"

  ocr:
    build:
      context: services/ocr
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - ocr

volumes:
  redis_data:
  baileys_auth:
