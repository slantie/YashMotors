# Active backend upstream for yashmotorsbackend.mooo.com (blue/green flip).
#
# Install once on the prod box (http context — e.g. /etc/nginx/conf.d/), then in the
# yashmotorsbackend.mooo.com server block use:
#
#     location / {
#         proxy_pass http://yashmotors_backend_active;
#         proxy_set_header Host              $host;
#         proxy_set_header X-Real-IP         $remote_addr;
#         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#         proxy_set_header X-Forwarded-Proto $scheme;
#     }
#
# Flip the target with deploy/flip-env.sh (rewrites this file + reloads nginx).
# Default = prod.

# ACTIVE: prod
upstream yashmotors_backend_active {
    server 127.0.0.1:3001;
}
